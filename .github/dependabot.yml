version: 2
# どのエコシステムも main 宛てに PR を作る（セキュリティの更新は target-branch に関係なく main 宛てに来るため、揃える）
# Dependabot の PR は main に直接マージせず、宛先を release/vX.Y.Z に変えてから入れる（docs/developers/dependabot.md）
updates:
  - package-ecosystem: "npm"
    directory: "/backend"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "backend"

  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "frontend"

  - package-ecosystem: "cargo"
    directory: "/src-tauri"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "rust"

  # ワークフローの actions は コミットの SHA で固定している。Dependabot が SHA と後ろのコメント（# v4 など）を更新する
  # .github/ は DMG の作り方（release.yml・tag-release.yml）を変えるため、ほかのエコシステムと同じく release/vX.Y.Z を通す
  # 更新は1つの PR にまとめる
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "github-actions"
    groups:
      github-actions:
        patterns:
          - "*"
