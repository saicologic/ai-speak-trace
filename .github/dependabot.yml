version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/backend"
    schedule:
      interval: "weekly"
    target-branch: "release/deps"
    labels:
      - "dependencies"
      - "backend"

  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    target-branch: "release/deps"
    labels:
      - "dependencies"
      - "frontend"

  - package-ecosystem: "cargo"
    directory: "/src-tauri"
    schedule:
      interval: "weekly"
    target-branch: "release/deps"
    labels:
      - "dependencies"
      - "rust"

  # ワークフローの actions は コミットの SHA で固定している。Dependabot が SHA と後ろのコメント（# v4 など）を更新する
  # .github/ はビルドに影響しないため、release/deps を通さず main に PR を作る
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "github-actions"
