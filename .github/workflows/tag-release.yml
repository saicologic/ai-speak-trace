name: Tag Release

# main から切った release/vX.Y.Z が push されたら、src-tauri/tauri.conf.json のバージョンで
# push されたコミットにタグ（vX.Y.Z）を作成し、Release ワークフロー（ドラフトのリリースを作る）を起動する。
# GITHUB_TOKEN で push したタグでは他のワークフローが起動しないため、
# GITHUB_TOKEN でも起動できる workflow_dispatch で release.yml をタグ指定で実行する。

on:
  push:
    branches: ['release/v*']

# 同じブランチへの push が重なったときに、タグの作成が並んで動かないようにする
concurrency:
  group: tag-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tag:
    # ブランチを消した push では動かさない
    if: github.event.deleted != true
    runs-on: ubuntu-latest
    permissions:
      # タグの push
      contents: write
      # release.yml の起動
      actions: write

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}

      - name: バージョン確認とタグ作成
        id: tag
        env:
          BRANCH: ${{ github.ref_name }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          VERSION=$(jq -r '.version' src-tauri/tauri.conf.json)
          TAG="v${VERSION}"

          # ブランチ名と tauri.conf.json のバージョンが一致しない場合は中断する
          if [ "$BRANCH" != "release/${TAG}" ]; then
            echo "::error::ブランチ名 ${BRANCH} と tauri.conf.json のバージョン ${VERSION} が一致しません"
            exit 1
          fi

          # 同じコミットを指すタグが既にある場合は、起動処理の再実行とみなして続行する
          # 異なるコミットを指す場合のみ中断する
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" > /dev/null; then
            git fetch --no-tags --depth=1 origin "refs/tags/${TAG}:refs/tags/${TAG}"
            EXISTING_SHA=$(git rev-parse "${TAG}^{commit}")
            if [ "$EXISTING_SHA" != "$HEAD_SHA" ]; then
              echo "::error::タグ ${TAG} は既に別のコミット ${EXISTING_SHA} を指しています"
              exit 1
            fi
            echo "タグ ${TAG} は既に ${HEAD_SHA} を指しているため、作成をスキップします"
          else
            git tag "$TAG" "$HEAD_SHA"
            git push origin "refs/tags/${TAG}"
            echo "タグ ${TAG} を ${HEAD_SHA} に作成しました"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Release ワークフローを起動
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref "$TAG"
