name: Build

# PRのたびに実行し、ビルドが必要なファイルが変わったときだけ macOS でビルドする。
# ブランチ保護の必須チェック「build」は、paths で飛ばすと pending のまま残るため、
# いつも動く build ジョブが changes と build-macos の結果をまとめて報告する。
# ビルド不要なファイルは changes ジョブの一覧で決める（一覧にないファイルはビルドする）。

on:
  pull_request:
    branches:
      - 'release/*'
      - main

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      build: ${{ steps.filter.outputs.build }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: ビルドが必要なファイルが変わったか調べる
        id: filter
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # 日本語などを含むパスが引用符付きにならないよう NUL 区切りで、移動したファイルは移動元も含めて取得する（失敗したらここで止まる）
          git diff -z --no-renames --name-only "$BASE_SHA...$HEAD_SHA" > "$RUNNER_TEMP/changed-files"
          build=false
          while IFS= read -r -d '' f; do
            case "$f" in
              # ビルド不要なファイル（ドキュメント・CI・開発ツールの設定）は、何もしない
              *.md|docs/*|.github/*|.claude/*|eval/*|LICENSE|.gitignore|.coderabbit.yaml|.mcp.json)
                ;;
              # テストのファイル（backend は tsconfig.build.json で、frontend は画面から import しないため、アプリに入らない。frontend の型の確認は test.yml の frontend-test でする）も、何もしない
              backend/src/*.spec.ts|frontend/src/*.test.ts|frontend/src/*.test.tsx)
                ;;
              # それ以外はビルドする
              *)
                # ファイル名は PR を作った人が決められるため、%q で改行などを見える形にして出す
                # （改行の後の「::」で始まる行が、GitHub Actions の命令として読まれないように）
                printf 'ビルドが必要なファイル: %q\n' "$f"
                build=true
                ;;
            esac
          done < "$RUNNER_TEMP/changed-files"
          echo "build=$build" >> "$GITHUB_OUTPUT"

  build-macos:
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: '.nvmrc'

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: aarch64-apple-darwin

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - run: cd backend && npm ci

      - run: cd frontend && npm ci

      # sidecarバイナリをtauri-action実行前に生成
      - name: バックエンドsidecarバイナリ生成
        run: npm run pkg:backend

      # リリース作成なし・署名ありでビルドのみ実行
      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          args: '--target aarch64-apple-darwin'

  # 必須チェック「build」。changes が失敗した・ビルドが必要なのに成功しなかった場合は失敗にする
  # （needs のジョブが失敗すると後のジョブは skipped になり、成功として扱われるため、always() で必ず動かす）
  build:
    needs: [changes, build-macos]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: ビルドの結果をまとめる
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          NEEDS_BUILD: ${{ needs.changes.outputs.build }}
          BUILD_RESULT: ${{ needs.build-macos.result }}
        run: |
          if [ "$CHANGES_RESULT" != "success" ]; then
            echo "変更したファイルを調べられませんでした（$CHANGES_RESULT）"
            exit 1
          fi
          if [ "$NEEDS_BUILD" != "true" ]; then
            echo "ビルド対象外のファイルのみ変更のためスキップ"
            exit 0
          fi
          if [ "$BUILD_RESULT" != "success" ]; then
            echo "macOS のビルドが成功しませんでした（$BUILD_RESULT）"
            exit 1
          fi
          echo "macOS のビルドが成功しました"
