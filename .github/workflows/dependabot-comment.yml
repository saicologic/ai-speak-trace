name: Dependency Diff Comment

on:
  workflow_run:
    # Dependency Diff Check（dependabot-diff.yml）の name と同じにする（違うと動かない）
    workflows: ['Dependency Diff Check']
    types: [completed]

# workflow_runトリガーはベースブランチのコードで動作するため、
# 書き込み権限を安全に使用できる
jobs:
  comment:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write

    steps:
      - name: Download diff report
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: diff-report
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}
          path: /tmp/diff-report

      - name: Post comment to PR
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const fs = require('fs');

            const prNumber = parseInt(fs.readFileSync('/tmp/diff-report/pr-number.txt', 'utf8').trim());
            const ecosystem = fs.readFileSync('/tmp/diff-report/ecosystem.txt', 'utf8').trim();
            const cargoSummary = fs.readFileSync('/tmp/diff-report/cargo-summary.txt', 'utf8').trim();
            const npmHasDiff = fs.readFileSync('/tmp/diff-report/npm-has-diff.txt', 'utf8').trim();

            let body = '## Dependency Diff Report\n\n';

            if (ecosystem === 'cargo') {
              body += '**Ecosystem**: Rust (Cargo)\n\n';
              body += '### Updated crates\n\n';
              if (cargoSummary) {
                body += '```\n' + cargoSummary + '\n```\n\n';
              } else {
                body += 'Could not get the diff.\n\n';
              }
              body += '> Check the Rust build manually with `npm run build`.\n';

            } else if (ecosystem === 'npm-backend') {
              body += '**Ecosystem**: npm (backend)\n\n';
              if (npmHasDiff === 'false') {
                body += '✅ **No build output changes** — the app behavior is not affected. Safe to merge.\n';
              } else if (npmHasDiff === 'true') {
                body += '⚠️ **Build output changed** — the app behavior may be affected. Review the changes.\n';
              } else {
                body += '❓ Skipped the build output comparison.\n';
              }

            } else if (ecosystem === 'npm-frontend') {
              body += '**Ecosystem**: npm (frontend)\n\n';
              if (npmHasDiff === 'false') {
                body += '✅ **No build output changes** — the app behavior is not affected. Safe to merge.\n';
              } else if (npmHasDiff === 'true') {
                body += '⚠️ **Build output changed** — the app behavior may be affected. Review the changes.\n';
              } else {
                body += '❓ Skipped the build output comparison.\n';
              }

            } else {
              body += 'Skipped: this ecosystem is not checked.\n';
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body: body,
            });
