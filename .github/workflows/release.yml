name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: macos-latest
    # dependabotのPRはSecretsにアクセスできないためスキップ
    if: github.actor != 'dependabot[bot]'
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - run: cd backend && npm ci

      - run: cd frontend && npm ci

      # sidecarバイナリをtauri-action実行前に生成
      - name: バックエンドsidecarバイナリ生成
        run: npm run pkg:backend

      # release/vX.Y.Z PRの「変更内容」セクションをリリースノートに使用
      - name: リリースノート生成
        id: release_notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"

          # release/vX.Y.Z にマージされたPRを検索
          PR_BODY=$(gh pr list \
            --repo ${{ github.repository }} \
            --state merged \
            --search "release: v${VERSION} in:title" \
            --json body \
            --jq '.[0].body // ""')

          # "## 変更内容" セクションを抽出し "## " で始まる次のセクションの直前まで取得
          CHANGES=$(echo "$PR_BODY" | awk '/^## 変更内容/{found=1; next} found && /^## /{exit} found{print}')

          if [ -z "$CHANGES" ]; then
            echo "::error::release: v${VERSION} のPRが見つからないか、「## 変更内容」セクションがありません"
            exit 1
          fi

          BODY="## 変更内容
          ${CHANGES}

          ## インストール方法
          DMGファイルをダウンロードしてマウントし、アプリケーションフォルダにドラッグしてください。"

          echo "body<<EOF" >> "$GITHUB_OUTPUT"
          echo "$BODY" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # コード署名・公証（dependabotはジョブごとスキップのため常に渡す）
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: v__VERSION__
          releaseName: 'v__VERSION__'
          releaseBody: ${{ steps.release_notes.outputs.body }}
          releaseDraft: false
          prerelease: false
          args: '--target aarch64-apple-darwin'

      # ビルド・公証失敗時に明示的なエラーメッセージを表示
      - name: ビルド失敗通知
        if: failure()
        run: |
          echo "::error::ビルドまたは公証に失敗しました。"
          echo "::error::公証エラー(403)の場合は https://developer.apple.com/account および https://appstoreconnect.apple.com/agreements でApple Developer契約を確認してください。"

      # 動作確認用（タグなしでもdmgをダウンロード可能にする）
      - name: dmgアーティファクトをアップロード
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: dmg
          path: src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
