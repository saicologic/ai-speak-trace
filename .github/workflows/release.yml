name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: macos-latest
    # dependabotのPRはSecretsにアクセスできないためスキップ
    if: github.actor != 'dependabot[bot]'
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: '.nvmrc'

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: aarch64-apple-darwin

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - run: cd backend && npm ci

      - run: cd frontend && npm ci

      # sidecarバイナリをtauri-action実行前に生成
      - name: バックエンドsidecarバイナリ生成
        run: npm run pkg:backend

      # ffmpeg静的バイナリをsrc-tauri/binaries/に配置
      - name: ffmpegバイナリ配置
        run: |
          node -e "
            const fs = require('fs');
            const p = require('ffmpeg-static');
            fs.copyFileSync(p, '../src-tauri/binaries/ffmpeg-aarch64-apple-darwin');
            fs.chmodSync('../src-tauri/binaries/ffmpeg-aarch64-apple-darwin', 0o755);
            console.log('ffmpeg配置完了:', p);
          "
        working-directory: backend

      # release/vX.Y.Z PRの「変更内容」セクションをリリースノートに使用
      - name: リリースノート生成
        id: release_notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"

          # release/vX.Y.Z にマージされたPRを検索
          PR_BODY=$(gh pr list \
            --repo ${{ github.repository }} \
            --state merged \
            --search "release: v${VERSION} in:title" \
            --json body \
            --jq '.[0].body // ""')

          # "## 変更内容" または "## Summary" セクションを抽出し "## " で始まる次のセクションの直前まで取得
          CHANGES=$(echo "$PR_BODY" | awk '/^## (変更内容|Summary)/{found=1; next} found && /^## /{exit} found{print}')

          if [ -z "$CHANGES" ]; then
            echo "::error::release: v${VERSION} のPRが見つからないか、「## 変更内容」または「## Summary」セクションがありません"
            exit 1
          fi

          BODY="## 変更内容
          ${CHANGES}

          ## インストール方法
          DMGファイルをダウンロードしてマウントし、アプリケーションフォルダにドラッグしてください。"

          echo "body<<EOF" >> "$GITHUB_OUTPUT"
          echo "$BODY" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # コード署名・公証（dependabotはジョブごとスキップのため常に渡す）
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: v__VERSION__
          releaseName: 'v__VERSION__'
          releaseBody: ${{ steps.release_notes.outputs.body }}
          releaseDraft: false
          prerelease: false
          args: '--target aarch64-apple-darwin'

      # ビルド・公証失敗時に明示的なエラーメッセージを表示
      - name: ビルド失敗通知
        if: failure()
        run: |
          echo "::error::ビルドまたは公証に失敗しました。"
          echo "::error::公証エラー(403)の場合は https://developer.apple.com/account および https://appstoreconnect.apple.com/agreements でApple Developer契約を確認してください。"

      # 動作確認用（タグなしでもdmgをダウンロード可能にする）
      - name: dmgアーティファクトをアップロード
        if: success()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: dmg
          path: src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
