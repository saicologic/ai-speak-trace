name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: macos-latest
    environment: ai-speak-trace
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - run: cd backend && npm ci

      - run: cd frontend && npm ci

      # タグまたはブランチ名からバージョンを取得してtauri.conf.jsonに同期
      - name: バージョンを同期
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION=${GITHUB_REF_NAME#v}
          elif [[ "$GITHUB_REF" == refs/heads/release/v* ]]; then
            VERSION=${GITHUB_REF_NAME#release/v}
          else
            echo "タグ・リリースブランチ以外のため、バージョン同期をスキップします"
            exit 0
          fi
          echo "同期するバージョン: $VERSION"
          sed -i '' "s/\"version\": \".*\"/\"version\": \"$VERSION\"/" src-tauri/tauri.conf.json

      # sidecarバイナリをtauri-action実行前に生成
      - name: バックエンドsidecarバイナリ生成
        run: npm run pkg:backend

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # コード署名・公証
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: v__VERSION__
          releaseName: 'v__VERSION__'
          releaseBody: 'DMGファイルをダウンロードしてダブルクリックし、アプリケーションフォルダにドラッグしてインストールしてください。'
          releaseDraft: false
          prerelease: false
          args: '--target aarch64-apple-darwin'

      # 動作確認用（タグなしでもdmgをダウンロード可能にする）
      - name: dmgアーティファクトをアップロード
        uses: actions/upload-artifact@v6
        with:
          name: dmg
          path: src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
