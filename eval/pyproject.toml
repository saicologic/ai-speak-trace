[project]
name = "ai-speak-trace-eval"
version = "0.1.0"
description = "AI Speak Trace の RAG 評価基盤"
requires-python = ">=3.12,<3.14"
dependencies = [
    "anthropic>=1.13.0",
    "boto3>=1.43.111",
    "httpx>=0.28.1",
    # ragas 0.4.3 が langchain_community.chat_models.vertexai を import するため 0.4 未満に固定
    "httpx2>=2.13.1",
    "langchain-community<0.4",
    "mlflow>=3.17.0",
    "pandas>=3.0.6",
    "ragas>=0.4.3",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
